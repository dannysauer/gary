[package]
name = "garyctl"
version = "0.1.0"
authors = ["Marek Counts <mcounts@suse.com>"]
edition = "2018"

[dependencies]
clap = "4"
zmq = "0.9"
core = { path = "../core" }
log = "0.4"
serde_cbor = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["vendored-zmq"]
vendored-zmq = ["zmq/vendored"]
