[package]
name = "gary-plugin-docker"
version = "0.0.2"
authors = ["Marek Counts <mcounts@suse.com>"]
edition = "2018"
description = "simple docker plugin for gary"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core = { path = "../../core" }
bollard = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
futures-util = "0.3"
